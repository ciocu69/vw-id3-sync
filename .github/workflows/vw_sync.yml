name: VW ID.3 Telemetry Sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure and Run EVCC
        env:
          VW_USER: ${{ secrets.VW_USER }}
          VW_PASS: ${{ secrets.VW_PASS }}
        run: |
          cat << 'EOF' > make_config.py
          import os
          u = os.environ.get("VW_USER", "").strip()
          p = os.environ.get("VW_PASS", "").strip()
          
          config_content = f"""vehicles:
            - name: id3
              type: template
              template: id
              title: ID3
              user: "{u}"
              password: "{p}"
          """
          with open("evcc.yaml", "w", encoding="utf-8") as f:
              f.write(config_content)
          EOF
          python3 make_config.py
          
          echo "=== CONFIG GENERAT (fara parola) ==="
          grep -v "password:" evcc.yaml
          echo "====================================="
          
          # Rulam direct pe latest cu parametrul vehicle
          docker run --rm -v $(pwd)/evcc.yaml:/etc/evcc.yaml evcc/evcc:latest evcc -c /etc/evcc.yaml vehicle > evcc_out.txt 2>&1 || true
          cat evcc_out.txt

      - name: Process Data
        run: python3 sync_vw.py

      - name: Commit to GitHub
        run: |
          git config user.name "VW-Bot"
          git config user.email "bot@github.com"
          git add vw_data.json
          git diff --staged --quiet || git commit -m "Auto-update VW telemetry"
          git push
          
