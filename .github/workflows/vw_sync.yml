name: VW ID.3 Telemetry Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EVCC Supported Templates
        run: |
          echo "=== TOATE TEMPLATE-URILE VOLKSWAGEN IN EVCC ==="
          docker run --rm evcc/evcc:latest evcc template vehicle | grep -iE "vw|volkswagen|id" || true
          
          echo -e "\n=== DETALII TEMPLATE VW ==="
          docker run --rm evcc/evcc:latest evcc template vehicle vw || true

          echo -e "\n=== DETALII TEMPLATE ID (daca exista) ==="
          docker run --rm evcc/evcc:latest evcc template vehicle id || true
          
