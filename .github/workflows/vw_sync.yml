name: VW ID.3 Telemetry Sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run EVCC
        env:
          VW_USER: ${{ secrets.VW_USER }}
          VW_PASS: ${{ secrets.VW_PASS }}
        run: |
          printf "vehicles:\n  - name: id3\n    type: template\n    template: id\n    user: \"%s\"\n    password: \"%s\"\n" "$VW_USER" "$VW_PASS" > evcc.yaml
          docker run --rm -v $(pwd)/evcc.yaml:/etc/evcc.yaml evcc/evcc:latest evcc -c /etc/evcc.yaml vehicle > evcc_out.txt 2>&1 || true
          cat evcc_out.txt

      - name: Parse Output
        run: python3 sync_vw.py

      - name: Save JSON
        run: |
          git config user.name "VW-Bot"
          git config user.email "bot@github.com"
          git add vw_data.json
          git diff --staged --quiet || git commit -m "Update VW telemetry"
          git push
          
