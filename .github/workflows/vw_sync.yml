name: VW ID.3 Telemetry Sync

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch via EVCC ID Template
        env:
          VW_USER: ${{ secrets.VW_USER }}
          VW_PASS: ${{ secrets.VW_PASS }}
        run: |
          python3 -c '
          import os
          u = os.environ["VW_USER"].replace("\"", "\\\"")
          p = os.environ["VW_PASS"].replace("\"", "\\\"")
          with open("evcc.yaml", "w") as f:
              f.write(f"vehicles:\n  - name: id3\n    type: template\n    template: id\n    user: \"{u}\"\n    password: \"{p}\"\n")
          '
          docker run --rm -v $(pwd)/evcc.yaml:/etc/evcc.yaml evcc/evcc:0.130.0 evcc -c /etc/evcc.yaml vehicle > evcc_out.txt || true
          cat evcc_out.txt

      - name: Process Data
        run: python3 sync_vw.py

      - name: Commit to GitHub
        run: |
          git config user.name "VW-Bot"
          git config user.email "bot@github.com"
          git add vw_data.json
          git diff --staged --quiet || git commit -m "Auto-update VW telemetry"
          git push
          
