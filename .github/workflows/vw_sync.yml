name: VW ID.3 Telemetry Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EVCC Help & Supported Types
        run: |
          echo "=== COMENZI DISPONIBILE ==="
          docker run --rm evcc/evcc:latest evcc --help || true
          
          echo -e "\n=== OPȚIUNI PENTRU VEHICLE ==="
          docker run --rm evcc/evcc:latest evcc vehicle --help || true
          
