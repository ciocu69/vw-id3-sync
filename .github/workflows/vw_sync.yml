name: VW ID.3 Telemetry Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect EVCC Templates & Vehicle Types
        run: |
          echo "=== VERIFICARE TEMPLATE-URI VEHICULE ==="
          docker run --rm evcc/evcc:latest evcc --help || true
          
          echo -e "\n=== DUMP PENTRU VEHICLE ==="
          docker run --rm evcc/evcc:latest evcc dump --template vehicle | grep -iE "vw|volkswagen|id" || true
          
