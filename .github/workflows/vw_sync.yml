name: VW ID.3 Telemetry Sync

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Test VW ID.3 Connection via Official EVCC Docker
        env:
          VW_USER: ${{ secrets.VW_USER }}
          VW_PASS: ${{ secrets.VW_PASS }}
        run: |
          cat <<EOF > evcc.yaml
          vehicles:
            - name: id3
              type: template
              template: vw
              user: "${VW_USER}"
              password: "${VW_PASS}"
          EOF
          docker run --rm -v $(pwd)/evcc.yaml:/etc/evcc.yaml evcc/evcc:latest evcc -c /etc/evcc.yaml vehicle
